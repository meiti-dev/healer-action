name: 'Healer (MEITI)'
description: 'Repairs your code in CI and returns it repaired or unchanged, never worse. Tests in a sandbox, security audit, AI review and real-use testing.'
author: 'MEITI'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  api-key:
    # 🩹 [BUG REAL, 2026-10-07, primera corrida en GitHub] Sin "${{ }}" en ninguna descripción: GitHub
    # evalúa las expresiones también acá y rechaza la Action entera al cargarla ("Unrecognized
    # named-value: 'secrets'"). En local no se ve, porque el runner es el que lee este archivo.
    description: 'Healer API key. Never write it in the workflow: save it as a GitHub secret (for example HEALER_API_KEY) and pass it from there.'
    required: true
  path:
    description: 'Folder to send, relative to the checkout. Default: the whole repo.'
    required: false
    default: '.'
  app-id:
    description: 'Id of this app in Healer, to keep history across runs. Default: "<owner>/<repo>" of this repository.'
    required: false
    default: ''
  app-intent:
    description: 'Short description of what the app does (optional, improves the real-use test).'
    required: false
    default: ''
  max-iterations:
    description: 'Maximum repair rounds per run.'
    required: false
    default: '8'
  test-uso-real:
    description: '"true" to also run a real-use test on the repaired app.'
    required: false
    default: 'false'
  start-command:
    description: 'Command that starts the dev server (required the first time test-uso-real is used for this app-id).'
    required: false
    default: ''
  port:
    description: 'Port where that command serves the app (required together with start-command).'
    required: false
    default: ''
  ai-level:
    description: 'Leave it empty to use your organization rule in the Healer panel (pro unless the owner changed it). "pro" repairs with paid APIs. "free" uses free-tier providers, which may keep what they receive, and the code may be used for training.'
    required: false
    default: ''
  allow-free:
    description: 'Free never runs hidden: when a job would run on free (you asked for it, or the pro repairs of the plan are used up) and the organization asks for confirmation, the run checks without repairing and without AI and says so. Set "true" to confirm free for this workflow.'
    required: false
    default: 'false'
  timeout-minutes:
    description: 'Minutes to wait for the result. Default: 60 with ai-level "free", 30 with "pro". If it runs out, the job keeps going in Healer and its result stays in the panel. Give the workflow job more time than this.'
    required: false
    default: ''
  fail-on:
    description: '"unresolved" (default) fails the step if Healer could not leave the code clean (also on a partial delivery) or the language is not supported (unsupported_stack). "never" never fails the step, to only report.'
    required: false
    default: 'unresolved'
  accept-lower-score:
    description: 'If Healer added a dependency so your tests could run and it lowers the quality score (known vulnerabilities), "false" (default) writes the repair without it and warns; "true" writes it too.'
    required: false
    default: 'false'
  apply-support-updates:
    description: 'If Healer had to raise dependency versions so the app runs on the current runtime (a support update), "true" (default) writes them with the repair. "false" writes only the bug repair.'
    required: false
    default: 'true'
  base-url:
    description: 'Healer server URL. Change it only to point to your own instance.'
    required: false
    default: 'https://healer-api.meiti.dev'

outputs:
  status:
    description: '"production_ready", "unresolved", "unsupported_stack" or "not_accepted" (Healer only reviewed: see not-accepted-reason).'
  repairs-count:
    description: 'Number of repairs actually applied.'
  pentagono-score:
    description: 'Quality (Pentágono) score, 0 to 100.'
  changed-files:
    description: 'Files Healer repaired and wrote to the workspace, one per line. Empty if nothing changed or the result was blocked.'
  app-id:
    description: 'The app-id used. Keep it if you did not set one, for future runs of the same app.'
  partial-fix:
    description: '"true" when some failures were fixed and others remain: status "unresolved", repaired files written.'
  not-accepted-reason:
    description: 'When status is "not_accepted": why Healer only reviewed (for example, a dependency that only installs by running a third-party installer). Empty otherwise.'
  failures-found:
    description: 'Failures found.'
  failures-fixed:
    description: 'Failures fixed.'
  target-tests:
    description: 'Whether your tests pass with what is delivered: pass, fail, did_not_run, not_reached, none or unknown.'
  tests-failing-before:
    description: 'Failing tests in your original code (empty if they could not be counted).'
  tests-failing-after:
    description: 'Failing tests with what is delivered (empty if they could not be counted).'
  pending-count:
    description: 'Items left pending, each explained in the job summary with what it needs.'

# Action de Node empaquetada (dist/index.mjs, con el SDK adentro): no instala nada al correr.
# Después de cambiar src/ o el SDK: npm run build, y commitear dist/.
runs:
  using: 'node24'
  main: 'dist/index.mjs'
